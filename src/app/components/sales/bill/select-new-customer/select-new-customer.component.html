<h6 class="mb-3 fw-bold">Customer Details</h6>
<form cForm [formGroup]="customerForm" (ngSubmit)="onSubmit()">
    <div class="col-12 mb-2">
        <label class="form-label small text-muted">Full Name</label>
        <input cFormControl formControlName="customerName" type="text" class="form-control" placeholder="Customer Name"
            appValidate fieldName="Customer name" />
    </div>

    <div class="col-12 mb-2">
        <label class="form-label small text-muted">Shop Name</label>
        <input type="text" formControlName="shopName" class="form-control" placeholder="Shop Name" appValidate
            fieldName="Shop name" />
    </div>

    <div class="col-12 mb-2">
        <label class="form-label small text-muted">Mobile No</label>
        <input type="text" formControlName="phone" class="form-control" placeholder="Customer Phone" appValidate
            fieldName="Mobile" />
    </div>

    <div class="col-12 mb-2">
        <label class="form-label small text-muted">Address</label>
        <input type="text" formControlName="address" class="form-control" placeholder="Customer Address" appValidate
            fieldName="Address" />
    </div>

    <div class="d-flex justify-content-center mt-4">
        <button type="submit" class="btn btn-primary fw-semibold" [disabled]="customerForm.invalid">
            Save Customer and Next
        </button>
    </div>
</form>
