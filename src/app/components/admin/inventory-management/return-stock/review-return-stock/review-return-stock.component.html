<c-modal id="liveDemoModal" size="lg" alignment="center" class="modal-scrollable" [visible]="visible"
  (visibleChange)="onChangeModalVisibility($event)">

  <c-modal-header>
    <h5 cModalTitle> Review Salesman's Return Stock</h5>
    <button (click)="onCloseModal()" cButtonClose></button>
  </c-modal-header>

  <c-modal-body>
    <c-row class="mb-3">
      <c-col>
        <label cLabel for="assignStock">Select Return Stock</label>
        <ng-select cFormControl name="assignStock" [items]="saleStockList" bindLabel="description" bindValue="code"
          [searchable]="true" [clearable]="true" placeholder="Search or select stock"
          (change)="onReturnStockChange($event)">
        </ng-select>
      </c-col>
    </c-row>

    <hr />

    <div class="mt-3">
      <h6 class="mb-3">Return Summary</h6>
      <table [striped]="true" cTable class="border">
        <thead cTableColor="light">
          <tr>
            <th class="text-center">Product Name</th>
            <th>Assigned Quantity</th>
            <th>Sold Quantity</th>
            <th>Balanced Quantity</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="!selectedSaleStockDetailsList || selectedSaleStockDetailsList.length === 0">
            <td colspan="4" class="text-center text-muted py-3">
              No data available
            </td>
          </tr>
          <tr *ngFor="let item of selectedSaleStockDetailsList; let i = index">
            <td class="text-center">{{item['productName']}}</td>
            <td class="text-center">{{item['quantityLoaded']}}</td>
            <td class="text-center">{{item['quantitySold']}}</td>
            <td class="text-center">{{item['balanceQuantity']}}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </c-modal-body>

  <c-modal-footer>
    <button (click)="onCloseModal()" cButton color="secondary">
      Close
    </button>
    <button cButton color="success" (click)="onSubmit()">Return Approved</button>
  </c-modal-footer>
</c-modal>
